# =============================================================================
# Paperclip on Railway — template
# -----------------------------------------------------------------------------
# Copy this file to the ROOT of the Paperclip Git repository as `railway.toml`
# (same level as https://github.com/paperclipai/paperclip package.json), then
# commit. Railway will pick it up on the next deploy.
#
# You still must set DATABASE_URL, BETTER_AUTH_* / PAPERCLIP_PUBLIC_URL, deployment mode,
# and any other secrets in the Railway dashboard (do not commit secrets).
# Public Railway: PAPERCLIP_DEPLOYMENT_MODE=authenticated, PAPERCLIP_DEPLOYMENT_EXPOSURE=public,
# HOST=0.0.0.0 (local_trusted forbids non-loopback bind — see deploy/paperclip/railway/README.md).
# BETTER_AUTH_URL or PAPERCLIP_PUBLIC_URL: full https:// origin (not bare hostname).
# =============================================================================

[build]
# Upstream root Dockerfile uses VOLUME; Railway's Dockerfile builder rejects that.
# Keep builder=RAILPACK so Node is built from package.json (see README if builds still pick Docker).
builder = "RAILPACK"
# Align pnpm with upstream "packageManager" in Paperclip root package.json.
buildCommand = "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm run build"

[deploy]
# After build, @paperclipai/server compiles to dist/ and starts via:
startCommand = "pnpm --filter @paperclipai/server start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Optional: expose a path that returns 200 without auth (uncomment if upstream adds one).
# healthcheckPath = "/"
# healthcheckTimeout = 300
